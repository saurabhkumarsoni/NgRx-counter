<div class="row">
  <div class="col-md-6 offset-md-3">
    <h3>Sign Up</h3>
    <hr>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- First Name -->
      <div class="form-group">
        <label>First Name</label>
        <input type="text" formControlName="firstName" class="form-control"
          [ngClass]="{'is-invalid': isInvalid('firstName')}" />
        <div *ngIf="isInvalid('firstName')" class="invalid-feedback">First Name is required</div>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" formControlName="lastName" class="form-control"
          [ngClass]="{'is-invalid': isInvalid('lastName')}" />
        <div *ngIf="isInvalid('lastName')" class="invalid-feedback">Last Name is required</div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control"
          [ngClass]="{'is-invalid': isInvalid('email')}" />
        <div *ngIf="isInvalid('email')" class="invalid-feedback">
          <div *ngIf="registerForm.get('email')?.hasError('required')">Email is required</div>
          <div *ngIf="registerForm.get('email')?.hasError('email')">Invalid email format</div>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control"
          [ngClass]="{'is-invalid': isInvalid('password')}" />
        <div *ngIf="isInvalid('password')" class="invalid-feedback">{{ getPasswordErrorMessage() }}</div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" class="form-control"
          [ngClass]="{'is-invalid': isInvalid('confirmPassword') || registerForm.errors?.['passwordMismatch']}" />
          <div *ngIf="isInvalid('confirmPassword') || registerForm.errors?.['passwordMismatch']" class="invalid-feedback">
            <div *ngIf="isInvalid('confirmPassword')">Confirm Password is required</div>
            <div *ngIf="registerForm.errors?.['passwordMismatch']">Passwords do not match</div>
          </div>
          
      </div>

      <!-- Submit Button -->
      <div class="form-group">
        <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">Register</button>
      </div>

    </form>
  </div>
</div>
