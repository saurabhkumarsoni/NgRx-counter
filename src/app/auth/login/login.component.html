<div class="row">
    <div class="col-md-6 offset-md-3">
      <h3>Login</h3>
      <hr>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
        <div class="mb-3 mt-3">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter email" formControlName="email">
          <div *ngIf="email?.touched && email?.invalid" class="text-danger">
            <small *ngIf="email?.errors?.['required']">Email is required</small>
            <small *ngIf="email?.errors?.['email']">Invalid email format</small>
          </div>
        </div>
  
        <div class="mb-3">
          <label for="pwd">Password:</label>
          <input type="password" class="form-control" id="pwd" placeholder="Enter password" formControlName="password">
          <div *ngIf="password?.touched && password?.invalid" class="text-danger">
            <small *ngIf="password?.errors?.['required']">Password is required</small>
            <small *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</small>
          </div>
        </div>
  
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Submit</button>
      </form>
    </div>
  </div>
